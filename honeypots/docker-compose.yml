networks:
  honeypot-net:
    driver: bridge

volumes:
  logs:

services:

  cowrie:
    build: ./cowrie
    container_name: cowrie
    user: "999:999"
    restart: unless-stopped
    dns: [127.0.0.1]
    ports:
      - "22:2222"    # SSH
      - "23:2223"    # Telnet
    volumes:
      - ./cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - ./cowrie/honeyfs:/cowrie/cowrie-git/honeyfs:ro
      - ./cowrie/share/cowrie/fs.pickle:/cowrie/cowrie-git/share/cowrie/fs.pickle:ro
      - ./logs/cowrie:/cowrie/cowrie-git/var/log/cowrie
    networks:
      - honeypot-net

  opencanary:
    build: ./opencanary
    container_name: opencanary
    restart: unless-stopped
    dns: [127.0.0.1]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./logs/opencanary:/var/log/opencanary
    networks:
      - honeypot-net

  dionaea:
    build: ./dionaea
    container_name: dionaea
    restart: unless-stopped
    dns: [127.0.0.1]
    ports:
      - "21:21"
    volumes:
      - ./logs/ftp:/opt/dionaea/var/log/dionaea
      - ./fake_corp/ftp_root:/opt/dionaea/fake_corp/ftp_root:ro
    networks:
      - honeypot-net

  mysql-honeypot:
    build: ./mysql
    container_name: mysql-honeypot
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; rows=open('/proc/net/tcp').readlines()[1:]; active={int(r.split()[1].split(':')[1],16) for r in rows if r.split()[3]=='0A'}; assert {3306}.issubset(active) and os.access('/opt/honeypot/logs/mysql.json',os.W_OK)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    restart: unless-stopped
    dns: [127.0.0.1]
    ports:
      - "3306:3306"
    volumes:
      - ./logs/mysql:/opt/honeypot/logs
    networks:
      - honeypot-net

  smb-honeypot:
    build: ./smb
    container_name: smb-honeypot
    restart: unless-stopped
    dns: [127.0.0.1]
    ports:
      - "445:445"
    volumes:
      - ./logs/smb:/opt/honeypot/logs
    networks:
      - honeypot-net

  scada-honeypot:
    build: ./scada
    container_name: scada-honeypot
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; rows=open('/proc/net/tcp').readlines()[1:]; active={int(r.split()[1].split(':')[1],16) for r in rows if r.split()[3]=='0A'}; assert {102, 502}.issubset(active) and os.access('/opt/honeypot/logs/conpot.json',os.W_OK)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    user: "10002:10002"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    restart: unless-stopped
    dns: [127.0.0.1]
    ports:
      - "502:502"   # Modbus/TCP
      - "102:102"   # S7comm / ISO-on-TCP (Siemens S7)
    volumes:
      - ./logs/scada:/opt/honeypot/logs
    networks:
      - honeypot-net
